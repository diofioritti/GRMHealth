<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Métricas - MedGemma POC</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen">
  <div class="max-w-6xl mx-auto p-6">
    <header class="bg-white rounded-2xl shadow p-6 border border-gray-200">
      <div class="flex items-center justify-between flex-wrap gap-3">
        <div>
          <div class="text-sm text-gray-500">MedGemma POC</div>
          <div class="text-xl font-bold text-gray-900">Métricas</div>
        </div>
        <div class="flex items-center gap-2">
          <button id="btn-refresh" class="px-4 py-2 rounded-lg bg-red-600 text-white text-sm hover:bg-red-700">Atualizar</button>
          <a href="index.html" class="text-sm text-red-600 hover:text-red-700">Voltar</a>
        </div>
      </div>
      <nav class="mt-4 flex flex-wrap gap-2">
        <a href="status.html" class="px-3 py-2 rounded-lg bg-white border text-sm hover:bg-gray-50">Status</a>
        <a href="logs.html" class="px-3 py-2 rounded-lg bg-white border text-sm hover:bg-gray-50">Logs</a>
        <a href="metricas.html" class="px-3 py-2 rounded-lg bg-red-600 text-white text-sm hover:bg-red-700">Métricas</a>
        <a href="monitoramento.html" class="px-3 py-2 rounded-lg bg-white border text-sm hover:bg-gray-50">Monitoramento</a>
      </nav>
    </header>

    <main class="mt-6 grid gap-4">
      <section class="bg-white rounded-2xl shadow p-6 border border-gray-200">
        <div id="status" class="text-sm text-gray-600">-</div>
        <div class="mt-4 grid md:grid-cols-4 gap-3">
          <div class="bg-gray-50 border rounded-xl p-4">
            <div class="text-xs text-gray-500">Total</div>
            <div id="total" class="text-2xl font-bold">-</div>
          </div>
          <div class="bg-gray-50 border rounded-xl p-4">
            <div class="text-xs text-gray-500">Tempo médio (ms)</div>
            <div id="avg" class="text-2xl font-bold">-</div>
          </div>
          <div class="bg-gray-50 border rounded-xl p-4">
            <div class="text-xs text-gray-500">Último request</div>
            <div id="last" class="font-mono text-xs mt-1">-</div>
          </div>
          <div class="bg-gray-50 border rounded-xl p-4">
            <div class="text-xs text-gray-500">Endpoints</div>
            <div id="endpoints-count" class="text-2xl font-bold">-</div>
          </div>
        </div>
      </section>

      <section class="bg-white rounded-2xl shadow p-6 border border-gray-200">
        <div class="text-lg font-semibold">Requests por endpoint</div>
        <div id="by-endpoint" class="mt-4 grid gap-2"></div>
      </section>

      <section class="bg-white rounded-2xl shadow p-6 border border-gray-200">
        <div class="text-lg font-semibold">JSON bruto</div>
        <pre id="raw" class="mt-3 whitespace-pre-wrap text-xs bg-gray-50 border rounded-xl p-4"></pre>
      </section>
    </main>
  </div>

  <script src="assets/js/api-client.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    const btn = document.getElementById('btn-refresh');

    function renderByEndpoint(obj) {
      const container = document.getElementById('by-endpoint');
      container.innerHTML = '';
      const entries = Object.entries(obj || {}).sort((a,b) => b[1]-a[1]);
      for (const [k,v] of entries) {
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between bg-gray-50 border rounded-xl p-3';
        row.innerHTML = `<div class="font-mono text-xs">${k}</div><div class="text-sm font-semibold">${v}</div>`;
        container.appendChild(row);
      }
      document.getElementById('endpoints-count').textContent = entries.length;
    }

    async function refresh() {
      statusEl.textContent = 'Carregando...';
      try {
        const m = await window.ApiClient.getMetrics();
        document.getElementById('total').textContent = m.total_requests ?? 0;
        document.getElementById('avg').textContent = (m.avg_processing_time_ms ?? 0).toFixed(0);
        document.getElementById('last').textContent = m.last_request_iso || '-';
        renderByEndpoint(m.by_endpoint || {});
        document.getElementById('raw').textContent = JSON.stringify(m, null, 2);
        statusEl.textContent = 'OK';
      } catch (e) {
        statusEl.textContent = e.message || 'Erro ao buscar métricas.';
      }
    }

    btn.addEventListener('click', refresh);
    refresh();
  </script>
</body>
</html>
