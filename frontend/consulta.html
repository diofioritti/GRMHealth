<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consulta - MedGemma POC</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen">
  <div class="max-w-4xl mx-auto p-6">
    <header class="bg-white rounded-2xl shadow p-6 border border-gray-200">
      <div class="flex items-center justify-between flex-wrap gap-3">
        <div class="flex items-center">
          <div class="w-10 h-10 bg-red-600 rounded-full flex items-center justify-center mr-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
            </svg>
          </div>
          <div>
            <div class="text-sm text-gray-500">MedGemma POC</div>
            <div class="text-xl font-bold text-gray-900">Consulta médica geral</div>
          </div>
        </div>
        <a href="index.html" class="text-sm text-red-600 hover:text-red-700">Voltar</a>
      </div>
      <nav class="mt-4 flex flex-wrap gap-2">
        <a href="chat.html" class="px-3 py-2 rounded-lg bg-white border text-sm hover:bg-gray-50">Chat</a>
        <a href="consulta.html" class="px-3 py-2 rounded-lg bg-red-600 text-white text-sm hover:bg-red-700">Consulta</a>
        <a href="triagem.html" class="px-3 py-2 rounded-lg bg-white border text-sm hover:bg-gray-50">Triagem</a>
        <a href="explicacao.html" class="px-3 py-2 rounded-lg bg-white border text-sm hover:bg-gray-50">Explicação</a>
        <a href="status.html" class="px-3 py-2 rounded-lg bg-white border text-sm hover:bg-gray-50">Status</a>
      </nav>
    </header>

    <main class="mt-6 bg-white rounded-2xl shadow p-6 border border-gray-200">
      <div class="grid gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Mensagem</label>
          <textarea id="message" rows="5" class="w-full px-4 py-3 bg-gray-50 rounded-xl border focus:outline-none focus:border-red-500" placeholder="Descreva sua dúvida (ex: dor de cabeça há 2 dias...)"></textarea>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Contexto (opcional)</label>
          <textarea id="context" rows="3" class="w-full px-4 py-3 bg-gray-50 rounded-xl border focus:outline-none focus:border-red-500" placeholder="Ex: idade, condições prévias, medicamentos, etc. (evite dados sensíveis)"></textarea>
        </div>

        <div class="flex items-center gap-3 flex-wrap">
          <button id="btn-send" class="px-5 py-3 rounded-xl bg-red-600 text-white font-semibold hover:bg-red-700 disabled:bg-gray-400">Enviar</button>
          <div id="status" class="text-sm text-gray-600"></div>
        </div>

        <div class="border-t pt-4">
          <div class="text-sm font-semibold text-gray-700">Resposta</div>
          <pre id="output" class="mt-2 whitespace-pre-wrap text-sm bg-gray-50 border rounded-xl p-4 min-h-[120px]"></pre>
          <div id="disclaimer" class="mt-3 text-xs text-gray-500"></div>
        </div>
      </div>
    </main>

    <footer class="mt-6 text-center text-xs text-gray-500">
      Esta é uma POC. Não substitui consulta médica.
    </footer>
  </div>

  <script src="assets/js/api-client.js"></script>
  <script>
    const btn = document.getElementById('btn-send');
    const statusEl = document.getElementById('status');
    const out = document.getElementById('output');
    const disclaimerEl = document.getElementById('disclaimer');

    async function send() {
      const message = document.getElementById('message').value.trim();
      const context = document.getElementById('context').value.trim() || null;
      if (!message) return;

      btn.disabled = true;
      statusEl.textContent = 'Enviando...';
      out.textContent = '';
      disclaimerEl.textContent = '';
      try {
        const resp = await window.ApiClient.sendQuery(message, context, "pt-BR");
        out.textContent = resp.response || '';
        disclaimerEl.textContent = resp.disclaimer || '';
        statusEl.textContent = `OK • ${resp.processing_time_ms?.toFixed?.(0) || '?'} ms`;
      } catch (e) {
        statusEl.textContent = 'Erro';
        out.textContent = e.message || 'Erro ao chamar a API.';
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener('click', send);
  </script>
</body>
</html>
