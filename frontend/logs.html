<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logs - MedGemma POC</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen">
  <div class="max-w-6xl mx-auto p-6">
    <header class="bg-white rounded-2xl shadow p-6 border border-gray-200">
      <div class="flex items-center justify-between flex-wrap gap-3">
        <div>
          <div class="text-sm text-gray-500">MedGemma POC</div>
          <div class="text-xl font-bold text-gray-900">Logs de interações</div>
        </div>
        <div class="flex items-center gap-2">
          <button id="btn-refresh" class="px-4 py-2 rounded-lg bg-red-600 text-white text-sm hover:bg-red-700">Recarregar</button>
          <a href="index.html" class="text-sm text-red-600 hover:text-red-700">Voltar</a>
        </div>
      </div>
      <nav class="mt-4 flex flex-wrap gap-2">
        <a href="chat.html" class="px-3 py-2 rounded-lg bg-white border text-sm hover:bg-gray-50">Chat</a>
        <a href="status.html" class="px-3 py-2 rounded-lg bg-white border text-sm hover:bg-gray-50">Status</a>
        <a href="logs.html" class="px-3 py-2 rounded-lg bg-red-600 text-white text-sm hover:bg-red-700">Logs</a>
        <a href="metricas.html" class="px-3 py-2 rounded-lg bg-white border text-sm hover:bg-gray-50">Métricas</a>
        <a href="monitoramento.html" class="px-3 py-2 rounded-lg bg-white border text-sm hover:bg-gray-50">Monitoramento</a>
      </nav>
      <p class="mt-3 text-xs text-gray-500">
        Por privacidade, os logs armazenam apenas um preview curto da mensagem.
      </p>
    </header>

    <main class="mt-6 bg-white rounded-2xl shadow border border-gray-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead class="bg-gray-50 border-b">
            <tr class="text-left text-xs text-gray-500">
              <th class="px-4 py-3">Timestamp</th>
              <th class="px-4 py-3">Endpoint</th>
              <th class="px-4 py-3">IP</th>
              <th class="px-4 py-3">Tempo (ms)</th>
              <th class="px-4 py-3">Modelo</th>
              <th class="px-4 py-3">Preview</th>
            </tr>
          </thead>
          <tbody id="rows" class="divide-y"></tbody>
        </table>
      </div>
      <div class="p-4 border-t bg-gray-50 flex items-center justify-between gap-3 flex-wrap">
        <div id="status" class="text-xs text-gray-600">-</div>
        <button id="btn-more" class="px-4 py-2 rounded-lg bg-white border text-sm hover:bg-gray-50 disabled:bg-gray-200" disabled>Carregar mais</button>
      </div>
    </main>
  </div>

  <script src="assets/js/api-client.js"></script>
  <script>
    const rowsEl = document.getElementById('rows');
    const statusEl = document.getElementById('status');
    const btnMore = document.getElementById('btn-more');
    const btnRefresh = document.getElementById('btn-refresh');

    let cursor = null;

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    function addRows(items) {
      for (const it of items) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="px-4 py-3 font-mono text-xs">${esc(it.ts_iso)}</td>
          <td class="px-4 py-3">${esc(it.endpoint)}</td>
          <td class="px-4 py-3 font-mono text-xs">${esc(it.client_ip)}</td>
          <td class="px-4 py-3">${esc(it.processing_time_ms?.toFixed?.(0) ?? it.processing_time_ms)}</td>
          <td class="px-4 py-3 font-mono text-xs">${esc(it.model_used)}</td>
          <td class="px-4 py-3 text-gray-700">${esc(it.message_preview)}</td>
        `;
        rowsEl.appendChild(tr);
      }
    }

    async function loadPage(reset=false) {
      statusEl.textContent = 'Carregando...';
      btnMore.disabled = true;
      try {
        if (reset) {
          rowsEl.innerHTML = '';
          cursor = null;
        }
        const resp = await window.ApiClient.getLogs(cursor, 50);
        addRows(resp.items || []);
        cursor = resp.next_cursor || null;
        btnMore.disabled = !cursor;
        statusEl.textContent = cursor ? 'OK • há mais páginas' : 'OK • fim';
      } catch (e) {
        statusEl.textContent = e.message || 'Erro ao carregar logs.';
      }
    }

    btnMore.addEventListener('click', () => loadPage(false));
    btnRefresh.addEventListener('click', () => loadPage(true));
    loadPage(true);
  </script>
</body>
</html>
